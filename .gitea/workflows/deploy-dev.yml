name: Build & Deploy → Dev

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build image
        id: build
        run: |
          TAG="dev-${GITHUB_SHA:0:8}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          nerdctl \
            --address /run/k3s/containerd/containerd.sock \
            --namespace k8s.io \
            build \
            --file Dockerfile.custom \
            --tag "outline-custom:${TAG}" \
            --tag "outline-custom:dev-latest" \
            .

      - name: Distribute image to worker nodes
        run: |
          TAG="${{ steps.build.outputs.tag }}"
          TMP_TAR="/tmp/outline-custom-${TAG}.tar"
          nerdctl --address /run/k3s/containerd/containerd.sock --namespace k8s.io \
            save "outline-custom:${TAG}" -o "${TMP_TAR}"
          for NODE in node2 node3 node4; do
            echo "  Copying to ${NODE} ..."
            scp -q -o StrictHostKeyChecking=no "${TMP_TAR}" "${NODE}:${TMP_TAR}"
            ssh -o StrictHostKeyChecking=no "${NODE}" \
              "nerdctl --address /run/k3s/containerd/containerd.sock --namespace k8s.io \
               load -i ${TMP_TAR} && rm ${TMP_TAR}"
          done
          rm "${TMP_TAR}"

      - name: Deploy to outline-dev
        run: |
          TAG="${{ steps.build.outputs.tag }}"
          kubectl -n outline-dev set image deployment/outline-dev outline="outline-custom:${TAG}"
          kubectl -n outline-dev patch deployment outline-dev \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"outline","imagePullPolicy":"IfNotPresent"}]}}}}'
          kubectl -n outline-dev rollout restart deployment/outline-dev
          kubectl -n outline-dev rollout status deployment/outline-dev --timeout=300s

      - name: Health check
        run: |
          sleep 15
          for i in 1 2 3; do
            if curl -sf --max-time 15 "https://dev.gabouchieno.com/_health" | grep -q "OK"; then
              echo "OK — https://dev.gabouchieno.com is healthy (attempt ${i})"
              exit 0
            fi
            echo "Attempt ${i} failed, retrying in 15s ..."
            sleep 15
          done
          echo "Health check failed after 3 attempts"
          kubectl -n outline-dev logs -l app=outline-dev --tail=50
          exit 1
